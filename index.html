<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0077FF">
  <meta name="description" content="Sigue en vivo el bus de Chilean Rent a Car en el aeropuerto de Santiago (SCL).">
  <title>Bus Aeropuerto | Chilean Rent a Car</title>
  <style>
    :root {
      --azul: #0077FF;
      --verde: #00E98F;
      --texto: #1B2B4B;
      --wa: #25D366;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      color: var(--texto);
      font-family: Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
    }
    header {
      flex: 0 0 auto;
      background: var(--azul);
      color: #fff;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
    }
    .brand img {
      height: 36px;
      width: auto;
      display: block;
    }
    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }
    .accent {
      height: 4px;
      margin: 0 -14px;
      background: var(--verde);
    }
    iframe {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      min-height: 0;
      background: #eef3fa;
    }
    .wa-spacer {
      flex: 0 0 auto;
      height: calc(76px + env(safe-area-inset-bottom, 0px));
    }
    a.wa {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--wa);
      color: #fff;
      text-align: center;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }
    a.wa:active { filter: brightness(.95); }
  </style>
</head>
